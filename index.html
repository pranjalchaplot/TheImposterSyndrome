<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imposter Syndrome — Classified Protocol</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23FF4438%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/><path d=%22m4.93 4.93 14.14 14.14%22/></svg>">
    
    <!-- Typography: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            animation: {
              'fade-in': 'fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
              'slide-up': 'slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1)',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scan': 'scan 2.5s ease-in-out infinite',
              'pop': 'pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'shimmer': 'shimmer 2s linear infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'scale(0.98)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              slideUp: {
                '0%': { transform: 'translateY(16px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              scan: {
                '0%, 100%': { transform: 'translateY(0%)', opacity: '0.3' },
                '50%': { transform: 'translateY(100%)', opacity: '0.8' },
              },
              pop: {
                '0%': { transform: 'scale(0.92)' },
                '100%': { transform: 'scale(1)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              }
            },
            colors: {
              brand: {
                void: '#0B0C0E',         // obsidian background
                dossier: '#14171D',      // primary card background
                surface: '#1E222B',      // interactive container / chip
                surfaceHover: '#282D39',
                border: '#2B303C',       // hairline rule / outline
                borderLight: '#3D4454',
                primary: '#FF4438',      // Signal Vermilion (The Locked Accent)
                primaryHover: '#E0362B',
                accent: '#FF4438',
                text: '#F4F5F7',         // crisp bone white
                muted: '#8E95A5',        // radar silver metadata
                success: '#10B981',
                warning: '#F59E0B',
                danger: '#EF4444',
              }
            }
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
</head>
  <body class="bg-brand-void text-brand-text font-sans antialiased overflow-hidden fixed inset-0 select-none">
    <div id="root" class="h-full w-full overflow-y-auto custom-scrollbar"></div>
    <style>
      /* Mobile safe areas and ergonomics */
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }

      /* Disable Tap Highlights globally for mobile */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      /* Disable Text Selection Background globally */
      ::selection {
        background: rgba(255, 68, 56, 0.25);
        color: #F4F5F7;
      }

      /* Squircles and continuous curves */
      .squircle {
        border-radius: 1.5rem;
        corner-smoothing: 60%;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #2B303C;
        border-radius: 20px;
      }

      /* 3D Card Flip */
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }

      /* 3D Dice Styles */
      .dice-scene {
        perspective: 600px;
        width: 40px;
        height: 40px;
      }
      .dice {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .dice-face {
        position: absolute;
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background: linear-gradient(145deg, #ffffff, #e2e8f0);
        border: 1px solid #cbd5e1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
        color: #334155;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        backface-visibility: hidden;
      }
      /* Face Transforms */
      .face-front  { transform: rotateY(0deg) translateZ(20px); }
      .face-back   { transform: rotateY(180deg) translateZ(20px); }
      .face-right  { transform: rotateY(90deg) translateZ(20px); }
      .face-left   { transform: rotateY(-90deg) translateZ(20px); }
      .face-top    { transform: rotateX(90deg) translateZ(20px); }
      .face-bottom { transform: rotateX(-90deg) translateZ(20px); }

      /* Robot Animation */
      .robot-head {
        transition: transform 0.3s ease;
      }
      .robot-head:hover {
        transform: translateY(-5px);
      }
    </style>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
